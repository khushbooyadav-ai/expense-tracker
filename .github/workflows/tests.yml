name: Tests

on:
  push:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check main.py test_main.py
      - run: ruff format --check main.py test_main.py
      - run: mypy main.py
      - run: python -m pytest