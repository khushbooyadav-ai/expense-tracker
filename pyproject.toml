[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "A simple command-line expense tracker"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
expenses = "main:main"

[tool.setuptools]
py-modules = ["main"]